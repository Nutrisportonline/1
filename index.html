<script>
(function(){
  function isValidEmail(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
  function patchValidation(){
    const emailInputs = document.querySelectorAll('input[type="email"]');
    emailInputs.forEach(input=>{
      if(input._validPatched) return;
      input._validPatched=true;
      input.addEventListener('blur', ()=>{
        const email=input.value.trim();
        if(email && !isValidEmail(email)){
          input.style.borderColor='#ef4444';
          let err=input.parentNode.querySelector('.email-err');
          if(!err){
            err=document.createElement('div');
            err.className='email-err';
            err.style.cssText='color:#ef4444;font-size:11px;margin-top:4px';
            input.parentNode.appendChild(err);
          }
          err.textContent='Correo invalido: usa formato nombre@dominio.com';
          setTimeout(()=>{input.style.borderColor=''; if(err) err.textContent='';}, 3000);
        }
      });
    });
    const btns=Array.from(document.querySelectorAll('button'));
    const regBtn=btns.find(b=>b.textContent.trim()==='Registrarse');
    const loginBtn=btns.find(b=>b.textContent.trim()==='Entrar');
    [regBtn, loginBtn].forEach(btn=>{
      if(!btn || btn._validCheck) return;
      btn._validCheck=true;
      btn.addEventListener('click', function(e){
        const emailEl=document.querySelector('input[type="email"]');
        const passEl=document.querySelector('input[type="password"]');
        if(!emailEl || !passEl) return;
        const email=emailEl.value.trim();
        const pass=passEl.value;
        if(email && !isValidEmail(email)){
          e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
          alert('Correo invalido: '+email);
          return false;
        }
        if(pass && pass.length>0 && pass.length<6){
          e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
          alert('Contrasena minimo 6 caracteres');
          return false;
        }
      }, true);
    });
  }
  setInterval(patchValidation, 800);
})();
</script>
